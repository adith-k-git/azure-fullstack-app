version: '3.9'

services:
  mongo:
    image: mongo:7.0
    container_name: task-manager-mongo
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'

  backend:
    build:
      context: ./backend
    container_name: task-manager-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      - MONGO_URI=mongodb://mongo:27017/task-manager
      - PORT=5000
      - NODE_ENV=production
    ports:
      - '5000:5000'
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: task-manager-frontend
    restart: unless-stopped
    ports:
      - '3000:4173'
    depends_on:
      - backend

volumes:
  mongo-data:
    name: task-manager-mongo-data
